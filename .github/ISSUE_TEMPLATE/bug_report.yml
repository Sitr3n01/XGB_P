name: Bug report
description: Something behaves differently from what the docs or the code promise.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities are **not** reported here — use [private reporting](https://github.com/Sitr3n01/XGB_P/security/advisories/new).
        Do not paste personal paths, account names, window titles or screenshots of your real desktop.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Opening and closing the bar (PS, Win+G, focus)
        - Games (open, pause, close, switch, recent)
        - Steam Big Picture navigation or Steam Input
        - Sound and media
        - Recording (Radeon ReLive) or AMD panel
        - Performance panel
        - Virtual keyboard
        - Connections, Night light or power
        - Controller and battery
        - Build, scripts or quality gate
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: XGB_P version
      description: The release tag, or the commit you built from.
      placeholder: v2.1.0-rc.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows build, whether the Xbox full screen experience was on, controller and connection (USB/Bluetooth), DSX version, Steam client date, GPU and driver.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The relevant lines of logs\xgb.log next to the executable, with personal paths and window titles removed.
      render: text
  - type: checkboxes
    id: sanitized
    attributes:
      label: Data hygiene
      options:
        - label: Nothing above contains a personal path, an account name or a window title.
          required: true
