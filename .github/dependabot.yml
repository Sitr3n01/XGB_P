# As unicas dependencias externas sao as actions dos workflows, fixadas por SHA
# de commit. O Dependabot mantem essas fixacoes atualizadas; cada atualizacao
# passa pela mesma CI de qualquer mudanca.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
